name: Publish to PyPI

# Triggered by a published GitHub Release. Uses PyPI Trusted Publishing
# (OIDC) so no long-lived PyPI token is stored in repo secrets. Set up:
#
#   1. On PyPI, go to: https://pypi.org/manage/account/publishing/
#   2. Add a Trusted Publisher with:
#        Owner       : dbe006
#        Repository  : rugguard-verify
#        Workflow    : publish.yml
#        Environment : pypi   (matches `environment: name: pypi` below)
#   3. Once configured, `gh release create v0.1.0` triggers this workflow
#      and publishes the corresponding sdist + wheel to PyPI.

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for PyPI Trusted Publishing — issues an OIDC token bound to
  # this exact workflow run.
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rugguard-verify
    steps:
      - name: Checkout
        # actions/checkout@v4 → 34e114876b0b11c390a56381ad16ebd13914f8d5
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Don't keep the GITHUB_TOKEN in .git/config after checkout —
          # the next step runs `python -m build` which executes
          # build-backend code (setuptools) from pyproject.toml. A
          # compromised transitive build dep would otherwise be able to
          # read that token.
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python@v5 → a26af69be951a213d495a4c3e4e4022e16d87065
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify build artifacts
        run: |
          ls -la dist/
          # Sanity-check that the wheel name matches what PyPI Trusted
          # Publishing is configured for. Mismatch = misconfigured tag or
          # forgotten version bump.
          test -f dist/rugguard_verify-*.whl
          test -f dist/rugguard_verify-*.tar.gz

      - name: Publish to PyPI
        # pypa/gh-action-pypi-publish@release/v1 → cef221092ed1bacb1cc03d23a2d87d1d172e277b
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        # No `password:` — OIDC handles auth via the id-token permission.
